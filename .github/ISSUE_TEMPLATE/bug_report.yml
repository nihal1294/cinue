name: Bug report
description: Report a reproducible problem in Cinue.
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the problem.
      placeholder: Cinue does … when I …
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: iOS or iPadOS version
      placeholder: iOS 26.5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or simulator
      placeholder: iPhone 17 Pro or iPad simulator
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cinue commit or version
      placeholder: Version 1.0 (commit abc1234)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reliably shows the problem.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect Cinue to do?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Confirm any uploaded diagnostic material is safe to share publicly.
      options:
        - label: I removed credentials and private viewing data from all logs and screenshots.
          required: true
