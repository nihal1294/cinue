name: Simulator package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Release app
        run: >-
          xcodebuild build
          -workspace Cinue.xcworkspace
          -scheme Cinue
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          CLANG_ENABLE_CODE_COVERAGE=NO
          ENABLE_CODE_COVERAGE=NO
          INFOPLIST_FILE="$GITHUB_WORKSPACE/Config/SimulatorPackage.plist"
          CINUE_SOURCE_REVISION="$GITHUB_SHA"
          CINUE_SOURCE_MODIFIED=NO

      - name: Package app
        run: |
          mkdir "$RUNNER_TEMP/simulator-package"
          scripts/package-simulator.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Cinue.app" "$RUNNER_TEMP/simulator-package"

      - name: Upload package for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cinue-iOS-Simulator-arm64
          path: ${{ runner.temp }}/simulator-package/*
          if-no-files-found: error
          retention-days: 30
